# CI for every pull request and push to main (docs/03 §9).
# Adapted from the illustrative pipeline: steps whose scripts do not exist yet
# (API integration tests, OpenAPI diff, web E2E smoke, web image) are added with
# the tasks that create them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-and-static:
    name: setup-and-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build, typecheck, lint, unit tests
        run: pnpm turbo run build typecheck lint test

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup-and-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway Send SMS hook secret (config.toml requires one)
        run: echo "SEND_SMS_HOOK_SECRETS=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start Postgres (applies migrations + seed)
        run: pnpm exec supabase db start
      - name: pgTAP tests
        run: pnpm exec supabase test db
      - name: Generated DB types match the migrations
        run: |
          pnpm --filter @flatrimony/db-types generate
          git diff --exit-code packages/db-types/src/db.ts
      - name: API integration tests (Postgres)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          pnpm turbo run build --filter=@flatrimony/api^...
          pnpm --filter @flatrimony/api test:integration
      - name: Stop Postgres
        if: always()
        run: pnpm exec supabase stop --no-backup

  mobile-bundle:
    name: mobile-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup-and-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@flatrimony/mobile^...
      - name: Export Android JS bundle (Metro + Hermes)
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo export --platform android --output-dir dist

  # Critical journey 1 (docs/03 §8.2) end to end on the app's web build: Supabase Auth with the
  # Send SMS hook → the API (mock SMS provider, dev outbox) → onboarding → Discover (T2.12).
  web-e2e-smoke:
    name: web-e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: setup-and-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway local secrets (hook secret, hash pepper)
        run: pnpm dev:secrets
      - name: Start Supabase (Postgres, Auth, REST, Storage)
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,vector,logflare,edge-runtime,mailpit,supavisor,realtime,postgres-meta
      - name: Local keys for the API and the app (from the running stack)
        run: pnpm dev:secrets
      - name: Build the API and the app's packages
        run: pnpm turbo run build --filter=@flatrimony/api... --filter=@flatrimony/mobile^...
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup node --env-file=.env.local dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Export the app for web
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm export:web
      - name: Install Chromium
        working-directory: apps/mobile
        run: pnpm exec playwright install --with-deps chromium
      - name: Journey 1 (Playwright)
        working-directory: apps/mobile
        run: pnpm test:e2e:web
      - name: API log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings still fail the job and show in the job summary; skipping the
          # SARIF artifact keeps the scan independent of Actions storage quota.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: SAST
        run: pipx run semgrep scan --config p/default --error --metrics off
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Dependency audit
        run: pnpm audit --audit-level high

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate (staging)
        working-directory: infra/terraform/envs/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build-images:
    name: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-and-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t web:ci .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t admin:ci .

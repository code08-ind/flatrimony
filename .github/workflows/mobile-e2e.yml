# Mobile E2E (docs/03 §8.1: Maestro flows on an Android emulator, nightly and before release).
# Builds a release APK of the app for the local stack (APP_ENV=local, debug-signed, no EAS account
# needed), starts Supabase and the API on the runner, and runs the Maestro flows in
# apps/mobile/e2e/maestro on an emulator.
#
# When it runs (founder decision 2026-11-28: the emulator run takes about 30 minutes, so it no
# longer runs on every app change while the app is being built):
#   - nightly, on main;
#   - by hand at checkpoints (Actions → mobile-e2e → Run workflow, or
#     `gh workflow run mobile-e2e --ref <branch>`): after every two or three major sub-phases and
#     before a milestone is marked done in docs/07;
#   - on pull requests that change the flows themselves or this workflow.
# The web journeys (apps/mobile/e2e/web) still run on every pull request (ci.yml, web-e2e-smoke).
name: mobile-e2e

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/e2e/maestro/**
      - .github/workflows/mobile-e2e.yml

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro-android:
    name: maestro-android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The Gradle build, the Supabase images and the emulator system image do not fit on a
      # standard runner's disk next to the preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft
          docker image prune -af > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile

      - name: Throwaway local secrets (hook secret, hash pepper)
        run: pnpm dev:secrets
      - name: Start Supabase (Postgres, Auth, REST, Storage)
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,vector,logflare,edge-runtime,mailpit,supavisor,realtime,postgres-meta
      - name: Local keys for the API and the app (from the running stack)
        run: pnpm dev:secrets
      - name: Build the API and the app's packages
        run: pnpm turbo run build --filter=@flatrimony/api... --filter=@flatrimony/mobile^...
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup node --env-file=.env.local dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/readyz > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build the release APK for the local stack
        working-directory: apps/mobile
        env:
          CI: '1'
          APP_ENV: local
        run: |
          # The emulator reaches the runner's localhost at 10.0.2.2.
          export EXPO_PUBLIC_API_URL=http://10.0.2.2:8080
          export EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321
          export EXPO_PUBLIC_SUPABASE_ANON_KEY="$(sed -n 's/^EXPO_PUBLIC_SUPABASE_ANON_KEY=//p' .env.local)"
          pnpm exec expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64)
          # Keep only the APK: the build tree and Gradle caches would leave no room for the emulator.
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app.apk"
          rm -rf android ~/.gradle/caches
          df -h /

      - name: Install Maestro (pinned release, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Journey 2 uploads photos and the walkthrough to the signed Storage URLs the API hands out,
      # which name the runner's 127.0.0.1:54321: `adb reverse` (in the emulator script) makes that
      # address reach the runner from inside the emulator.
      # Journey 2 picks three photos from the gallery: fresh random-block PNGs each run, so the
      # duplicate-photo check (T3.8) has nothing to match.
      - name: Gallery photos for journey 2
        run: |
          mkdir -p "$RUNNER_TEMP/photos"
          python3 - "$RUNNER_TEMP/photos" <<'PY'
          import random, struct, sys, zlib
          def png(path, w=800, h=600, block=50):
              colours = [[tuple(random.randrange(256) for _ in range(3)) for _ in range(w // block)] for _ in range(h // block)]
              raw = b''.join(b'\x00' + b''.join(bytes(colours[y // block][x // block]) for x in range(w)) for y in range(h))
              chunk = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 6)) + chunk(b'IEND', b''))
          for i in range(3):
              png(f'{sys.argv[1]}/room-{i + 1}.png')
          PY
          ls -la "$RUNNER_TEMP/photos"

      - name: Journeys 1 and 2 (Maestro on an Android emulator)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # The emulated back camera records journey 2's walkthrough.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated
          working-directory: apps/mobile
          script: |
            mkdir -p "$RUNNER_TEMP/maestro"
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$RUNNER_TEMP/app.apk"
            maestro test e2e/maestro/journey-1.yaml -e API_URL=http://localhost:8080 --format junit --output "$RUNNER_TEMP/maestro/report-1.xml" --debug-output "$RUNNER_TEMP/maestro/debug-1"
            for f in "$RUNNER_TEMP"/photos/*.png; do adb push "$f" /sdcard/Pictures/; adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d "file:///sdcard/Pictures/$(basename "$f")" > /dev/null; sleep 1; done
            adb shell content call --uri content://media --method scan_volume --arg external_primary > /dev/null || true
            echo "Gallery photos indexed: $(adb shell content query --uri content://media/external/images/media --projection _display_name | grep -c room-)"
            adb reverse tcp:54321 tcp:54321
            maestro test e2e/maestro/journey-2.yaml -e API_URL=http://localhost:8080 --format junit --output "$RUNNER_TEMP/maestro/report-2.xml" --debug-output "$RUNNER_TEMP/maestro/debug-2"

      - name: API log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true
      # Artifact storage is at its quota on this account, so the evidence goes to the job log.
      - name: Failure evidence (screen at the failing step, app logs)
        if: failure()
        run: |
          for dir in $(find "$RUNNER_TEMP/maestro" -type d -name 'journey-*'); do
          echo "=== $dir"
          echo '--- Steps that did not complete'
          node -e "for (const c of require(process.argv[1])) if (c.metadata?.status !== 'COMPLETED') console.log(JSON.stringify(c).slice(0, 2000))" "$dir/commands.json" || true
          echo '--- On screen at the failure (text / accessibility text / id)'
          for f in "$dir"/screen-hierarchy/*.json; do
            [ -f "$f" ] || continue
            node -e "
              const walk = (n) => { const a = n.attributes || {};
                const t = [a.text, a['accessibilityText'], a['resource-id']].filter(Boolean).join(' | ');
                if (t) console.log(t); (n.children || []).forEach(walk); };
              walk(require(process.argv[1]));" "$f" | head -80
          done
          echo '--- Crash (first lines of the exception)'
          grep -E -A12 'FATAL EXCEPTION|JavascriptException|Unhandled JS Exception' "$dir/logs/device-logcat.txt" | head -n 40 || true
          grep -E 'ReactNativeJS.*(Error|Exception|Invariant)' "$dir/logs/device-logcat.txt" | head -n 20 || true
          echo '--- App log (React Native, crashes)'
          grep -E 'ReactNativeJS|AndroidRuntime|FATAL|ReactNative|Hermes' "$dir/logs/device-logcat.txt" | tail -n 80 || true
          done
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

packages:
  - apps/*
  - packages/*

# Expo / React Native resolve modules most reliably from a hoisted node_modules.
nodeLinker: hoisted

# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  esbuild: true
  supabase: true

# Only fetch platform-specific optional binaries (turbo, supabase CLI, esbuild…) for the
# machine running the install; CI fetches its own from the same lockfile.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]

# Large native binaries (Next SWC, Supabase CLI) need more than the default 60 s on slow links.
fetchTimeout: 600000
networkConcurrency: 6

# Supply-chain hardening (docs/03 §14): wait 7 days before installing newly published
# versions, refuse versions that drop provenance/trust signals, and block git/tarball
# sub-dependencies.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Reviewed exceptions: long-established releases published without provenance after
# earlier versions had it. Add only after checking the version's age and maintainers.
trustPolicyExclude:
  - undici-types@6.21.0
blockExoticSubdeps: true

# One React for every app: React Native's renderer requires the exact version Expo SDK 58
# ships with (19.3.0). Bump together with the Expo SDK.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
